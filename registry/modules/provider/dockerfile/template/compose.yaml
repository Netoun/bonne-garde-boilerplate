services:
  app:
    build:
      context: .
      args:
        # Baked into the SPA bundle at build time; keep it equal to APP_URL below.
        VITE_API_URL: ${APP_URL:-http://localhost:5172}
    restart: unless-stopped
    ports:
      - "5172:5172"
    volumes:
      - app-data:/data
    environment:
      APP_URL: ${APP_URL:-http://localhost:5172}
      # Name the header your reverse proxy overwrites with the client's address (x-forwarded-for) when
      # one sits in front: every client shares the proxy's address without it. Leave it blank when the
      # port is published to clients directly, where a client could set that header itself.
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
      # The email module's key. Compose does not forward the host's environment on its own, so it is named
      # here; the API boots without it and the first email asked for fails, naming it.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # BETTER_AUTH_SECRET: generated into ${DATA_DIR}/secrets on first start when unset.
      # BETTER_AUTH_SECRET: "replace-with-a-random-secret-of-at-least-32-characters"

volumes:
  app-data:
